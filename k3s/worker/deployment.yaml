apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: tixin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: adppandey/backend-user-service:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/workers/index.worker.js"]
          env:
            - name: NODE_ENV
              value: "production"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1024"
          envFrom:
            - secretRef:
                name: tixin-env
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: "0.75"
              memory: "1.5Gi"
            requests:
              cpu: "0.5"
              memory: "512Mi"
