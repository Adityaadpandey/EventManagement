apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tixin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: adppandey/backend-user-service:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/bin.js"]
          ports:
            - containerPort: 7001
          env:
            - name: NODE_ENV
              value: "production"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=2048"
            - name: UV_THREADPOOL_SIZE
              value: "16"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "7001"
          envFrom:
            - secretRef:
                name: tixin-env
          readinessProbe:
            httpGet:
              path: /health
              port: 7001
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7001
            initialDelaySeconds: 60
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            limits:
              cpu: "3"
              memory: "7Gi"
            requests:
              cpu: "1.5"
              memory: "2Gi"
