# nginx.conf - DDoS/DoS Protected Configuration for GCP 4-core/16GB RAM server
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

# Optimize for containerized environment with DDoS protection
worker_rlimit_nofile 65535;
worker_priority -5;  # Higher priority for nginx workers

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations for containerized environment
    sendfile on;
    sendfile_max_chunk 512k;   # Reduced for container
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 50M;
    client_body_timeout 30;
    client_header_timeout 30;
    send_timeout 30;
    reset_timedout_connection on;

    # Buffer sizes (optimized for Docker container)
    client_body_buffer_size 64k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    output_buffers 2 32k;
    postpone_output 1460;

    # File caching (container-optimized)
    open_file_cache max=5000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:32m;    # Reduced for container
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_buffer_size 4k;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 10s;

    # Logging (optimized for containers with log rotation)
    log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time" '
                       'cs=$upstream_cache_status';

    # Stdout logging for Docker
    access_log /var/log/nginx/access.log detailed;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/rdf+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/font-woff
        application/font-woff2;

    # Cache settings (using Docker volume)
    proxy_cache_path /var/cache/nginx/api
                     levels=1:2
                     keys_zone=api_cache:64m
                     max_size=512m
                     inactive=60m
                     use_temp_path=off;

    proxy_cache_path /var/cache/nginx/static
                     levels=1:2
                     keys_zone=static_cache:32m
                     max_size=256m
                     inactive=1d
                     use_temp_path=off;

    # DDoS Protection: Multi-layer rate limiting
    # Layer 1: Per-IP rate limits
    limit_req_zone $binary_remote_addr zone=api:32m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=auth:16m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=heavy:16m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=burst:16m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general:32m rate=500r/m;
    
    # Layer 2: Per-session rate limits (using cookie/token)
    limit_req_zone $cookie_session zone=session_api:16m rate=300r/m;
    
    # Layer 3: Global rate limits (all IPs combined)
    limit_req_zone $server_name zone=global:16m rate=10000r/m;
    
    # Connection limiting with multiple zones
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:32m;
    limit_conn_zone $server_name zone=conn_limit_global:16m;
    
    # Request body size limiting per IP
    limit_req_zone $binary_remote_addr zone=upload:16m rate=10r/m;
    
    # Slow request protection
    limit_req_zone $binary_remote_addr zone=slow:16m rate=5r/s;

    # Upstream configuration for Docker service
    upstream backend_api {
        server backend-service:7001 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # Specialized upstream for auth operations
    upstream backend_api_auth {
        server backend-service:7001 max_fails=2 fail_timeout=10s;
        keepalive 16;
        keepalive_requests 100;
    }

    # Specialized upstream for heavy operations
    upstream backend_api_heavy {
        server backend-service:7001 max_fails=3 fail_timeout=60s;
        keepalive 8;
        keepalive_requests 50;
        keepalive_timeout 120s;
    }

    # HTTP server (redirect to HTTPS)
    server {
        listen 80 default_server;
        server_name api.tixin.in;

    # Health check for load balancers (no redirect)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect all other HTTP requests to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server with DDoS protection
    server {
        listen 443 ssl default_server reuseport;
        http2 on;
        server_name api.tixin.in;

        # Let's Encrypt SSL Certificate paths
        ssl_certificate /etc/letsencrypt/live/api.tixin.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.tixin.in/privkey.pem;

        # Enhanced security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # DDoS Protection: Connection limiting
        limit_conn conn_limit_per_ip 20;        # Max 20 concurrent connections per IP
        limit_conn conn_limit_global 5000;      # Max 5000 total concurrent connections
        
        # General rate limiting for all requests
        limit_req zone=general burst=100 nodelay;
        limit_req zone=global burst=2000 nodelay;
        
        # Request size limits
        client_body_buffer_size 32k;
        client_header_buffer_size 2k;
        large_client_header_buffers 4 8k;
        
        # Timeout protection against slowloris attacks
        client_body_timeout 10s;
        client_header_timeout 10s;
        send_timeout 10s;
        
        # Block only malicious scanners/bots (not legitimate tools)
        if ($http_user_agent ~* (nikto|nmap|masscan|sqlmap|havij|acunetix)) {
            return 403;
        }
        
        # Block common attack patterns in URI
        if ($request_uri ~* "(union|select|insert|cast|set|declare|drop|update|md5|benchmark|script|javascript|alert|document|cookie)") {
            return 403;
        }
        
        # Block requests with suspicious headers
        if ($http_referer ~* (baidu|semalt|viagra|cialis|poker)) {
            return 403;
        }

        # Nginx health check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Static file handling with caching
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            proxy_cache static_cache;
            proxy_cache_valid 200 1d;
            proxy_cache_key "$scheme$request_method$host$request_uri";

            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            access_log off;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* \.(css|js|woff|woff2|ttf|eot)$ {
            proxy_cache static_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_key "$scheme$request_method$host$request_uri";

            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            access_log off;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health and metrics endpoints (no rate limiting)
        location ~ ^/(health|metrics)$ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Authentication endpoints with STRICT DDoS protection
        location ~ ^/api/v1/auth/ {
            # Multi-layer rate limiting for auth
            limit_req zone=auth burst=3 nodelay;
            limit_req zone=slow burst=10 nodelay;
            limit_conn conn_limit_per_ip 5;
            
            # Require valid content type
            if ($content_type !~ "application/json") {
                return 415;
            }

            proxy_pass http://backend_api_auth;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 15s;
            
            # Disable buffering for auth to fail fast
            proxy_buffering off;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Rate-Limit-Remaining $limit_req_status always;
        }

        # Heavy operations with DDoS protection
        location ~ ^/api/v1/(payment|ticket-validation)/ {
            # Strict rate limiting for expensive operations
            limit_req zone=heavy burst=5 nodelay;
            limit_req zone=upload burst=3 nodelay;
            limit_conn conn_limit_per_ip 10;
            
            # Require authentication header (basic validation)
            if ($http_authorization = "") {
                return 401;
            }

            proxy_pass http://backend_api_heavy;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
            proxy_buffering off;
            
            # Request timeout protection
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Rate-Limit-Remaining $limit_req_status always;
        }

        # Admin endpoints (MAXIMUM protection)
        location ~ ^/api/v1/admin/ {
            # Extremely strict rate limiting
            limit_req zone=auth burst=2 nodelay;
            limit_conn conn_limit_per_ip 3;
            
            # Require authentication
            if ($http_authorization = "") {
                return 401;
            }
            
            # Additional IP whitelist check (optional - uncomment and add IPs)
            # allow 203.0.113.0/24;  # Your office IP range
            # deny all;

            proxy_pass http://backend_api_auth;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Rate-Limit-Remaining $limit_req_status always;
        }

        # Cacheable API endpoints (events, listers) with DDoS protection
        location ~ ^/api/v1/(event|lister)(/|$) {
            # Moderate rate limiting with burst allowance
            limit_req zone=api burst=30 nodelay;
            limit_req zone=session_api burst=50 nodelay;
            limit_conn conn_limit_per_ip 15;

            # Aggressive caching to reduce backend load
            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 302 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_valid any 30s;
            proxy_cache_key "$scheme$request_method$host$request_uri$http_accept_encoding";
            proxy_cache_bypass $http_cache_control $http_pragma $arg_nocache;
            proxy_cache_revalidate on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Rate-Limit-Remaining $limit_req_status always;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 20s;
            
            # Fail fast on backend issues
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }

        # High-traffic endpoints with aggressive caching
        location ~ ^/api/v1/(search|popular|trending)/ {
            # Allow higher burst but with rate limiting
            limit_req zone=burst burst=50 nodelay;
            limit_conn conn_limit_per_ip 10;

            # Aggressive caching for high-traffic endpoints
            proxy_cache api_cache;
            proxy_cache_valid 200 2m;
            proxy_cache_valid 404 30s;
            proxy_cache_key "$scheme$request_method$host$request_uri$args";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Rate-Limit-Remaining $limit_req_status always;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_send_timeout 8s;
            proxy_read_timeout 12s;
            
            # Fail fast
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 1;
        }

        # All other API endpoints with protection
        location /api/ {
            # Standard rate limiting
            limit_req zone=api burst=20 nodelay;
            limit_conn conn_limit_per_ip 15;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 20s;
            proxy_read_timeout 30s;

            # Enable buffering for better performance
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # Fail fast on errors
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            
            add_header X-Rate-Limit-Remaining $limit_req_status always;
        }

        # Catch-all for other requests
        location / {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }
    }
}
