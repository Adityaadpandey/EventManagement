services:
  backend-service:
    image: adppandey/backend-user-service:latest
    pull_policy: always
    container_name: backend-service-stag
    ports:
      - "7001:7001"
    command: ["node", "dist/index.js"]
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=7001
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://0.0.0.0:7001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    env_file:
      - .env
    restart: unless-stopped

  redis:
    image: redis/redis-stack:6.2.6-v19
    container_name: redis
    environment:
      REDIS_ARGS: "--requirepass cantremember"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cantremember", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  redis_data:
    driver: local
    name: redis_data_stag
