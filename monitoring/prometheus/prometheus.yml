global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'cadvisor'
    metrics_path: /metrics
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend-service:7001']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']   # note: you'd need an nginx-exporter if desired

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
