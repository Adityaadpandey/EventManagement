
name: Build, Push, and Deploy with Notifications
on:
  push:
    branches:
      - main

env:
  DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
      build_status: ${{ job.status }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REPOSITORY }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Extract build date
        id: build_date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: servers/user-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.sha_short }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}

      - name: Notify build status
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🏗️ *Build Status:* ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}

            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* `${{ steps.vars.outputs.sha_short }}`
            *Author:* ${{ github.actor }}
            *Message:* ${{ github.event.head_commit.message }}

            [View Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  deploy-to-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment start
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *Starting Staging Deployment*

            *Environment:* Staging
            *Server:* stag.tixin.in
            *Image:* `${{ needs.build-and-push.outputs.image_tag }}`

            ⏳ Deploying...

      - name: Deploy to staging server
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: stag.tixin.in
          username: ubuntu
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            echo "📦 Starting deployment..."
            cd EventManagement

            # Pull latest images
            echo "⬇️ Pulling images..."
            docker compose -f docker-compose.stag.yaml pull

            # Start services
            echo "🚀 Starting services..."
            docker compose -f docker-compose.stag.yaml up -d --force-recreate

            # Wait for backend health
            echo "⏳ Checking backend health..."
            for i in {1..30}; do
              if docker compose -f docker-compose.stag.yaml exec -T backend-service wget --no-verbose --tries=1 --spider http://localhost:7001/health 2>/dev/null; then
                echo "✅ Backend is healthy!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "❌ Backend health check failed"
                docker compose -f docker-compose.stag.yaml logs --tail=50 backend-service
                exit 1
              fi
              echo "Attempt $i/30..."
              sleep 2
            done

            # Wait for nginx health
            echo "⏳ Checking nginx health..."
            for i in {1..20}; do
              if docker compose -f docker-compose.stag.yaml exec -T nginx wget --no-verbose --tries=1 --spider http://localhost/nginx-health 2>/dev/null; then
                echo "✅ Nginx is healthy!"
                break
              fi
              if [ $i -eq 20 ]; then
                echo "❌ Nginx health check failed"
                docker compose -f docker-compose.stag.yaml logs --tail=50 nginx
                exit 1
              fi
              echo "Attempt $i/20..."
              sleep 2
            done

            # Test external endpoint
            echo "🔍 Testing external endpoint..."
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://stag.tixin.in/health || echo "000")
            echo "HTTP_CODE=$HTTP_CODE" >> /tmp/deploy_result.txt

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ External endpoint is healthy!"
              echo "STATUS=success" >> /tmp/deploy_result.txt
            else
              echo "❌ External endpoint returned: $HTTP_CODE"
              echo "STATUS=warning" >> /tmp/deploy_result.txt
            fi

            # Cleanup
            echo "🧹 Cleaning up..."
            docker image prune -f

            # Get container stats
            echo "📊 Container Status:"
            docker compose -f docker-compose.stag.yaml ps

            echo "✨ Deployment complete!"

      - name: Get deployment details
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: stag.tixin.in
          username: ubuntu
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            cd EventManagement

            # Get container status
            echo "=== CONTAINER STATUS ==="
            docker compose -f docker-compose.stag.yaml ps --format json | jq -r '.[] | "Container: \(.Name), Status: \(.State), Health: \(.Health)"'

            # Get health check result if exists
            if [ -f /tmp/deploy_result.txt ]; then
              cat /tmp/deploy_result.txt
              rm /tmp/deploy_result.txt
            fi

            # Test endpoint
            echo "=== ENDPOINT TEST ==="
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\nResponse Time: %{time_total}s\n" https://stag.tixin.in/health || echo "Endpoint check failed"

      - name: Notify deployment success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ✅ *Staging Deployment SUCCESS*

            *Environment:* Staging
            *Server:* stag.tixin.in
            *Image:* `${{ needs.build-and-push.outputs.image_tag }}`
            *Duration:* ${{ job.duration }}

            🔗 [Test URL](https://stag.tixin.in/health)
            📊 [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            All health checks passed! 🎉

      - name: Notify deployment failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *Staging Deployment FAILED*

            *Environment:* Staging
            *Server:* stag.tixin.in
            *Image:* `${{ needs.build-and-push.outputs.image_tag }}`

            ⚠️ *Action Required!*
            Check the logs immediately:
            📊 [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Deployment has been rolled back.

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: stag.tixin.in
          username: ubuntu
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            echo "❌ Rolling back..."
            cd EventManagement
            docker compose -f docker-compose.stag.yaml down
            docker compose -f docker-compose.stag.yaml up -d
            echo "Rollback complete"
