# .github/workflows/changelog.yml
name: Auto Changelog Generator

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for better commit analysis
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Get commit information
      id: commit-info
      run: |
        # Get the latest commit details
        COMMIT_SHA=$(git rev-parse HEAD)
        COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s")
        COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
        COMMIT_DATE=$(git log -1 --pretty=format:"%ci")
        BRANCH_NAME=${GITHUB_REF#refs/heads/}

        # Get changed files
        if [ "${{ github.event_name }}" = "push" ]; then
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || git diff --name-only HEAD~1 HEAD)
        else
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
        fi

        # Save to environment
        echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
        echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
        echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_ENV
        echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
        echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
        echo "CHANGED_FILES<<EOF" >> $GITHUB_ENV
        echo "$CHANGED_FILES" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Generate change entry
      run: |
        # Create changes.md if it doesn't exist
        if [ ! -f changes.md ]; then
          echo "# Change Log" > changes.md
          echo "" >> changes.md
          echo "This file tracks all changes made to the repository." >> changes.md
          echo "" >> changes.md
        fi

        # Create temporary file for new entry
        cat << EOF > temp_change.md
        ## $(date '+%Y-%m-%d %H:%M:%S UTC') - Branch: $BRANCH_NAME

        **Commit:** \`$COMMIT_SHA\`
        **Author:** $COMMIT_AUTHOR
        **Message:** $COMMIT_MESSAGE

        ### Files Changed:
        EOF

        # Add changed files to the entry
        if [ -n "$CHANGED_FILES" ]; then
          echo "$CHANGED_FILES" | while read -r file; do
            if [ -n "$file" ]; then
              echo "- \`$file\`" >> temp_change.md
            fi
          done
        else
          echo "- No files changed" >> temp_change.md
        fi

        echo "" >> temp_change.md
        echo "---" >> temp_change.md
        echo "" >> temp_change.md

    - name: Update changes.md
      run: |
        # Combine new entry with existing changes.md
        if [ -f changes.md ]; then
          # Read the header (first 4 lines)
          head -n 4 changes.md > new_changes.md
          # Add the new entry
          cat temp_change.md >> new_changes.md
          # Add the rest of the old content (skip header)
          tail -n +5 changes.md >> new_changes.md
          # Replace the original file
          mv new_changes.md changes.md
        else
          mv temp_change.md changes.md
        fi

        # Clean up
        rm -f temp_change.md

    - name: Commit and push changes
      run: |
        git add changes.md

        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        # Check if this is a protected branch
        if [[ "$BRANCH_NAME" == "production" || "$BRANCH_NAME" == "main" ]]; then
          # For protected branches, create a new branch and PR
          CHANGELOG_BRANCH="auto-changelog-$(date +%s)"
          git checkout -b $CHANGELOG_BRANCH
          git commit -m "Auto-update changelog for commit $COMMIT_SHA"
          git push origin $CHANGELOG_BRANCH

          echo "CHANGELOG_BRANCH=$CHANGELOG_BRANCH" >> $GITHUB_ENV
          echo "CREATED_PR_BRANCH=true" >> $GITHUB_ENV
        else
          # For non-protected branches, push directly
          git commit -m "Auto-update changelog for commit $COMMIT_SHA"
          git push
        fi

    - name: Create pull request for protected branches
      if: env.CREATED_PR_BRANCH == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const commitSha = process.env.COMMIT_SHA;
          const commitAuthor = process.env.COMMIT_AUTHOR;
          const commitMessage = process.env.COMMIT_MESSAGE;
          const branchName = process.env.BRANCH_NAME;
          const changelogBranch = process.env.CHANGELOG_BRANCH;
          const changedFiles = process.env.CHANGED_FILES.split('\n').filter(f => f.trim()).map(f => '- `' + f + '`').join('\n');

          const prBody = `## 🤖 Automated Changelog Update

                        This PR was automatically created to update the changelog for the recent commit.

            **Commit Details:**
            - **SHA:** \`${commitSha}\`
            - **Author:** ${commitAuthor}
            - **Message:** ${commitMessage}
            - **Branch:** ${branchName}

            ### Files Changed:
            ${changedFiles}

            ---

            *This PR can be safely merged to update the project changelog.*`;

          try {
            const pr = await github.rest.pulls.create({
              owner: owner,
              repo: repo,
              title: '📝 Auto-update changelog for commit ' + commitSha.substring(0, 7),
              head: changelogBranch,
              base: branchName,
              body: prBody
            });

            console.log('Created PR #' + pr.data.number + ': ' + pr.data.html_url);

            // Add labels if they exist
            try {
              await github.rest.issues.addLabels({
                owner: owner,
                repo: repo,
                issue_number: pr.data.number,
                labels: ['documentation', 'automated']
              });
            } catch (labelError) {
              console.log('Labels not found, skipping...');
            }

          } catch (error) {
            console.error('Error creating PR:', error);
            core.setFailed('Failed to create pull request: ' + error.message);
          }

    - name: Create pull request comment (for PRs)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          // Read the latest entry from changes.md
          const changesContent = fs.readFileSync('changes.md', 'utf8');
          const lines = changesContent.split('\n');

          // Find the first changelog entry (after header)
          let startIndex = -1;
          let endIndex = -1;

          for (let i = 0; i < lines.length; i++) {
            if (lines[i].startsWith('## ') && startIndex === -1) {
              startIndex = i;
            } else if (lines[i] === '---' && startIndex !== -1) {
              endIndex = i;
              break;
            }
          }

          if (startIndex !== -1 && endIndex !== -1) {
            const latestEntry = lines.slice(startIndex, endIndex).join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📝 Changelog Preview\n\nThis PR will add the following entry to changes.md:\n\n${latestEntry}`
            });
          }
