# .github/workflows/changelog-simple.yml
name: Simple Changelog Generator

on:
  push:
    branches: [ main, production ]

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'  # Prevent infinite loops
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Get commit details
      id: commit-info
      run: |
        COMMIT_SHA="${{ github.sha }}"
        COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s")
        COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
        COMMIT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        BRANCH_NAME="${{ github.ref_name }}"

        # Get changed files
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)

        echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
        echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
        echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_ENV
        echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
        echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
        echo "CHANGED_FILES<<EOF" >> $GITHUB_ENV
        echo "$CHANGED_FILES" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Create changelog entry
      run: |
        # Create a unique branch name
        TIMESTAMP=$(date +%s)
        CHANGELOG_BRANCH="changelog-update-$TIMESTAMP"

        # Create and switch to new branch
        git checkout -b $CHANGELOG_BRANCH
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Create changes.md if it doesn't exist
        if [ ! -f changes.md ]; then
          cat << 'EOF' > changes.md
        # Change Log

        This file tracks all changes made to the repository.

        EOF
        fi

        # Create new entry
        cat << EOF > temp_entry.md
        ## $COMMIT_DATE - Branch: $BRANCH_NAME

        **Commit:** \`${COMMIT_SHA:0:8}\`
        **Author:** $COMMIT_AUTHOR
        **Message:** $COMMIT_MESSAGE

        ### Files Changed:
        EOF

        # Add changed files
        if [ -n "$CHANGED_FILES" ]; then
          echo "$CHANGED_FILES" | while IFS= read -r file; do
            if [ -n "$file" ]; then
              echo "- \`$file\`" >> temp_entry.md
            fi
          done
        else
          echo "- No files detected" >> temp_entry.md
        fi

        echo "" >> temp_entry.md
        echo "---" >> temp_entry.md
        echo "" >> temp_entry.md

        # Insert new entry after the header
        head -n 4 changes.md > new_changes.md
        cat temp_entry.md >> new_changes.md
        tail -n +5 changes.md >> new_changes.md
        mv new_changes.md changes.md
        rm temp_entry.md

        # Commit the changes
        git add changes.md
        git commit -m "📝 Update changelog for commit ${COMMIT_SHA:0:8}"
        git push origin $CHANGELOG_BRANCH

        echo "CHANGELOG_BRANCH=$CHANGELOG_BRANCH" >> $GITHUB_ENV

    - name: Create Pull Request
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;

          const pr = await github.rest.pulls.create({
            owner,
            repo,
            title: `📝 Update changelog for ${process.env.COMMIT_SHA.substring(0, 8)}`,
            head: process.env.CHANGELOG_BRANCH,
            base: process.env.BRANCH_NAME,
            body: `## 🤖 Automated Changelog Update

          This PR updates the changelog with details from the latest commit.

          **Commit:** \`${process.env.COMMIT_SHA.substring(0, 8)}\`
          **Author:** ${process.env.COMMIT_AUTHOR}
          **Message:** ${process.env.COMMIT_MESSAGE}

          ### Changed Files:
          ${process.env.CHANGED_FILES.split('\n').filter(f => f.trim()).map(f => `- \`${f}\``).join('\n')}

          ---

          *This PR was automatically generated and can be safely merged.*`
          });

          console.log(\`Created PR #\${pr.data.number}\`);

          // Try to add labels
          try {
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.data.number,
              labels: ['documentation', 'changelog', 'automated']
            });
          } catch (e) {
            console.log('Could not add labels (they might not exist)');
          }
