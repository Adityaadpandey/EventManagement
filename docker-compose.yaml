services:
  postgres:
    image: postgres:latest
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgress
      POSTGRES_DB: event_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:6.2.6-v19
    container_name: redis
    environment:
      REDIS_ARGS: "--requirepass cantremember"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cantremember", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: servers/user-server/Dockerfile
    image: backend-user-service
    ports:
      - "7001:7001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgress@postgres:5432/event_management"
      REDIS_URL: "redis://:cantremember@redis:6379"
      PORT: 7001
      LOG_LEVEL: info
      NODE_ENV: DEVELOPMENT
      JWT_SECRET: supersecretkey

      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_PHONE_NUMBER: ""

      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""

  worker-service:
    build:
      context: .
      dockerfile: servers/worker-server/Dockerfile
    image: backend-worker-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgress@postgres:5432/event_management"
      REDIS_URL: "redis://:cantremember@redis:6379"
      LOG_LEVEL: info
      NODE_ENV: DEVELOPMENT
      JWT_SECRET: supersecretkey

      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_PHONE_NUMBER: ""

      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
