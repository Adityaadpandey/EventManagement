services:
  backend-service:
    build:
      context: .
      dockerfile: servers/user-server/Dockerfile
    image: backend-service
    ports:
      - "7001:7001"
    command: ["node", "dist/bin.js"]
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=2048  # Increased for 16GB server
      - UV_THREADPOOL_SIZE=16
      - HOST=0.0.0.0
      - PORT=7001
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://0.0.0.0:7001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"  # Increased log retention
    # Resource limits for better container management
    deploy:
      resources:
        limits:
          memory: 4G  # Allocate more memory for main service
          cpus: '2.5'   # Use 2.5 cores for backend
    networks:
      - app-network

  worker:
    build:
      context: .
      dockerfile: servers/user-server/Dockerfile
    image: backend-service
    command: ["node", "dist/workers/index.worker.js"]
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=1024  # Increased worker memory
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G    # Allocate memory for worker
          cpus: '1'     # Use 1 core for worker
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
      # Let's Encrypt SSL certificates
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend-service:
        condition: service_healthy
    restart: unless-stopped
    # Resource allocation for nginx
    deploy:
      resources:
        limits:
          memory: 512M  # Sufficient for nginx with caching
          cpus: '0.5'   # Use 0.5 core for nginx
    # Health check for nginx
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  # Optional: Add a monitoring service
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    # Enhanced network configuration
    driver_opts:
      com.docker.network.driver.mtu: 1500
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  nginx-cache:
    driver: local
    driver_opts:
      # For better performance, you can mount this to SSD storage
      type: none
      o: bind
      device: /opt/nginx-cache  # Create this directory on host SSD
