services:
  backend-service:
    build:
      context: .
      dockerfile: servers/user-server/Dockerfile
    image: backend-service
    ports:
      - "7001:7001"
    command: ["node", "dist/bin.js"]
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=2048
      - UV_THREADPOOL_SIZE=16
      - HOST=0.0.0.0
      - PORT=7001
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://0.0.0.0:7001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    # DDoS Protection: Resource limits
    deploy:
      resources:
        limits:
          memory: 3G  # Reduced to leave more for nginx cache
          cpus: '2.5'
        reservations:
          memory: 2G
          cpus: '1.5'
    # Security: Read-only root filesystem where possible
    security_opt:
      - no-new-privileges:true
    # Limit process capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - app-network

  worker:
    build:
      context: .
      dockerfile: servers/user-server/Dockerfile
    image: backend-service
    command: ["node", "dist/workers/index.worker.js"]
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=1024
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      replicas: 3  # Reduced from 4 to save resources
      resources:
        limits:
          memory: 1.5G
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.5'
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Nginx logs for monitoring
      - nginx-logs:/var/log/nginx
    depends_on:
      backend-service:
        condition: service_healthy
    restart: unless-stopped
    # DDoS Protection: Enhanced resource allocation
    deploy:
      resources:
        limits:
          memory: 1G  # Increased for better caching
          cpus: '1'   # Full core for nginx
        reservations:
          memory: 512M
          cpus: '0.5'
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/nginx-health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Sysctl for DDoS protection
    sysctls:
      - net.core.somaxconn=4096
      - net.ipv4.tcp_max_syn_backlog=8192
      - net.ipv4.ip_local_port_range=1024 65535
    networks:
      - app-network

  # Optional: Add a monitoring service
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    # Enhanced network configuration
    driver_opts:
      com.docker.network.driver.mtu: 1500
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  nginx-cache:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1024m,uid=101,gid=101  # nginx user
  nginx-logs:
    driver: local
