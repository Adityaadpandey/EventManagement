services:
  backend-service:
    build:
      context: .
      dockerfile: servers/user-server/Dockerfile
    image: backend-service
    ports:
      - "7001:7001"
    command: ["node", "dist/bin.js"]
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=1536
      - UV_THREADPOOL_SIZE=16
      - HOST=0.0.0.0
      - PORT=7001
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://0.0.0.0:7001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    depends_on:
      - vector-backend

  vector-backend:
    image: timberio/vector:latest-alpine
    volumes:
      # Mount docker container logs directory (for container logs)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Mount Vector config file (you will create this next)
      - ./vector-backend/vector.toml:/etc/vector/vector.toml:ro
    networks:
      - app-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: servers/user-server/Dockerfile
    image: backend-service
    command: ["node", "dist/workers/index.worker.js"]
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - vector-worker

  vector-worker:
    image: timberio/vector:latest-alpine
    depends_on:
      - worker
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./vector-worker/vector.toml:/etc/vector/vector.toml:ro
    networks:
      - app-network
    restart: unless-stopped

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    environment:
      - ZO_ROOT_USER_EMAIL=admin@example.com
      - ZO_ROOT_USER_PASSWORD=admin123
    ports:
      - "5080:5080"
      - "5081:5081"
    volumes:
      - openobserve-data:/data
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      backend-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  nginx-cache:
    driver: local
  openobserve-data:
    driver: local
