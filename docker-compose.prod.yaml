services:
  backend-service:
    image: adppandey/backend-user-service:latest
    pull_policy: always
    container_name: backend-service
    ports:
      - "7001:7001"
    command: ["node", "dist/bin.js"]
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=2048
      - UV_THREADPOOL_SIZE=16
      - HOST=0.0.0.0
      - PORT=7001
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://0.0.0.0:7001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    # DDoS Protection: Resource limits
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first  # Critical for zero downtime
      rollback_config:
        parallelism: 1
        delay: 5s
    # Security: Read-only root filesystem where possible
    security_opt:
      - no-new-privileges:true
    # Limit process capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - app-network

  worker:
    image: adppandey/backend-user-service:latest
    pull_policy: always
    container_name: worker
    command: ["node", "dist/workers/index.worker.js"]
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=1024
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1.5G
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.5'
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./blacklist.conf:/etc/nginx/blacklist.conf:ro
      - ./nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
      - ./letsencrypt/conf:/etc/letsencrypt:rw
      - ./letsencrypt/www:/var/www/certbot:rw
    depends_on:
      backend-service:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE  # Add this for cache directory access
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/nginx-health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    sysctls:
      - net.core.somaxconn=4096
      - net.ipv4.tcp_max_syn_backlog=8192
      - net.ipv4.ip_local_port_range=1024 65535
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./letsencrypt/www:/var/www/certbot
      - ./letsencrypt/conf:/etc/letsencrypt
    entrypoint: sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done"
    restart: unless-stopped
    networks:

networks:
  app-network:
    driver: bridge
    # Enhanced network configuration
    driver_opts:
      com.docker.network.driver.mtu: 1500
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  nginx-cache:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/nginx-cache
      o: bind
  nginx-logs:
    driver: local
